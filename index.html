<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Osakafe Menu">
<meta name="theme-color" content="#F4EBE0">
<title>Osakafe · Menu</title>
<link rel="apple-touch-icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <img class="logo" src="logo.png" alt="Osakafe">
    <nav class="nav" id="nav"></nav>
    <div class="foot"><div class="sig"><span>The depth beneath the simplicity</span><b></b></div></div>
  </aside>

  <main class="main">
    <div class="head">
      <div>
        <div class="eyebrow" id="eyebrow"></div>
        <h1 class="title" id="title"></h1>
        
      </div>
      <div class="kanji" id="kanji" aria-hidden="true"></div>
    </div>
    <div class="stage" id="stage"><div class="grid" id="grid"></div></div>
  </main>

  <section class="bar" aria-label="Tuỳ chỉnh">
    <div class="lb">Tuỳ chỉnh theo ý bạn</div>
    <div class="pills"><span>Ít đường</span><span>Ít đá</span><span>Nhiều đá</span></div>
  </section>
</div>

<script src="app.js"></script>
</body>
</html>
